version: 2
updates:
  - package-ecosystem: "bundler"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
        exclude-patterns:
        - "rubocop*"
      rubocop:
        patterns:
        - "rubocop*"
    directory: "/siade"
    schedule:
      day: "monday"
      time: "05:00"
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "bundler"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
        exclude-patterns:
        - "rubocop*"
      rubocop:
        patterns:
        - "rubocop*"
    directory: "/site"
    schedule:
      day: "monday"
      time: "05:00"
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "bundler"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    directory: "/mocks"
    schedule:
      day: "monday"
      time: "05:00"
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "bundler"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    directories:
      - "/clients/ruby/commons"
      - "/clients/ruby/api_entreprise"
      - "/clients/ruby/api_particulier"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      day: "monday"
      time: "05:00"
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    groups:
      development-dependencies:
        dependency-type: "development"
    directories:
      - "/clients/node"
      - "/clients/node/commons"
      - "/clients/node/api-entreprise"
      - "/clients/node/api-particulier"
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
    schedule:
      day: "monday"
      time: "05:00"
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      day: "monday"
      time: "05:00"
      interval: "weekly"
    cooldown:
      default-days: 7
