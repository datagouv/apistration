name: "Site: Sync fiches to data.gouv.fr"

on:
  push:
    branches: [main]
    paths:
      - 'commons/endpoints/**'
  workflow_dispatch: {}

concurrency:
  group: site-sync-datagouv
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  sync:
    name: Sync data.gouv.fr fiches
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILS_ENV: test
      DATAGOUV_HOST: ${{ vars.DATAGOUV_HOST }}
      DATAGOUV_API_TOKEN: ${{ secrets.DATAGOUV_API_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup ruby
        uses: ruby/setup-ruby@v1.316.0
        with:
          bundler-cache: true
          cache-version: 322
          working-directory: site

      - name: Compute changed fiche uids (to sync only those)
        if: github.event_name == 'push'
        id: changed_uids
        working-directory: .
        run: |
          if ! FILES=$(git diff --name-only --diff-filter=d "${{ github.event.before }}" "${{ github.event.after }}" -- commons/endpoints); then
            echo "::error::git diff failed to compute changed files between ${{ github.event.before }} and ${{ github.event.after }} (shallow history or invalid before-SHA?)"
            exit 1
          fi
          FILES=$(echo "$FILES" | grep '\.yml$' || true)
          if [ -z "$FILES" ]; then
            echo "uids=" >> "$GITHUB_OUTPUT"
          else
            UIDS=$(ruby -ryaml -e '
              uids = ARGV.flat_map { |f| (YAML.safe_load_file(f, aliases: true)["fiche"] || []).map { |e| e["uid"] } }
              puts uids.compact.reject { |uid| uid.match?(/[,\[\]]/) }.join(",")
            ' $FILES)
            echo "uids=$UIDS" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync changed fiches
        if: github.event_name == 'push' && steps.changed_uids.outputs.uids != ''
        env:
          SYNC_UIDS: ${{ steps.changed_uids.outputs.uids }}
        run: bundle exec rails datagouv:sync

      - name: Sync all fiches
        if: github.event_name == 'workflow_dispatch'
        run: bundle exec rails datagouv:sync_all
