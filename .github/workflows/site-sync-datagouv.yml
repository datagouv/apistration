name: "Site: Sync fiches to data.gouv.fr"

on:
  push:
    branches: [main]
    paths:
      - 'commons/endpoints/**'
  workflow_dispatch: {}

concurrency:
  group: site-sync-datagouv
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: site

jobs:
  sync:
    name: Sync data.gouv.fr fiches
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: admin_apientreprise
          POSTGRES_PASSWORD: wow*verysecret
          POSTGRES_DB: admin_apientreprise_test
          POSTGRES_PORT: 5432
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports: ["6379:6379"]
        options: --entrypoint redis-server
    env:
      RAILS_ENV: test
      DATAGOUV_HOST: ${{ vars.DATAGOUV_HOST }}
      DATAGOUV_API_TOKEN: ${{ secrets.DATAGOUV_API_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup ruby
        uses: ruby/setup-ruby@v1.316.0
        with:
          bundler-cache: true
          cache-version: 322
          working-directory: site

      - name: Install postgres client
        run: sudo apt-get install libpq-dev

      - name: Create database users
        env:
          POSTGRES_USER: admin_apientreprise
          POSTGRES_DB: admin_apientreprise_test
          PGPASSWORD: wow*verysecret
        run: |
          psql -h localhost -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} -f `pwd`/postgresql_setup.txt

      - name: Create database
        run: bundle exec rails db:create db:schema:load

      - name: Compute changed fiche uids
        if: github.event_name == 'push'
        id: changed_uids
        working-directory: .
        run: |
          if ! FILES=$(git diff --name-only --diff-filter=d "${{ github.event.before }}" "${{ github.event.after }}" -- commons/endpoints); then
            echo "::error::git diff failed to compute changed files between ${{ github.event.before }} and ${{ github.event.after }} (shallow history or invalid before-SHA?)"
            exit 1
          fi
          FILES=$(echo "$FILES" | grep '\.yml$' || true)
          if [ -z "$FILES" ]; then
            echo "uids=" >> "$GITHUB_OUTPUT"
          else
            UIDS=$(ruby -ryaml -e '
              uids = ARGV.flat_map { |f| (YAML.safe_load_file(f, aliases: true)["fiche"] || []).map { |e| e["uid"] } }
              puts uids.compact.reject { |uid| uid.match?(/[,\[\]]/) }.join(",")
            ' $FILES)
            echo "uids=$UIDS" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync changed fiches
        if: github.event_name == 'push' && steps.changed_uids.outputs.uids != ''
        env:
          SYNC_UIDS: ${{ steps.changed_uids.outputs.uids }}
        run: bundle exec rails datagouv:sync

      - name: Sync all fiches
        if: github.event_name == 'workflow_dispatch'
        run: bundle exec rails datagouv:sync_all

      - name: Commit any datagouv_uid changes
        if: ${{ !cancelled() }}
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED_FILES=$(git diff --name-only -- commons/endpoints)
          if [ -z "$CHANGED_FILES" ]; then
            echo "No datagouv_uid changes to commit."
            exit 0
          fi
          for FILE in $CHANGED_FILES; do
            SHA=$(gh api "repos/${{ github.repository }}/contents/$FILE?ref=develop" --jq '.sha')
            CONTENT=$(base64 -w0 "$FILE")
            gh api --method PUT "repos/${{ github.repository }}/contents/$FILE" \
              -f message="chore: sync datagouv_uid for $FILE" \
              -f content="$CONTENT" \
              -f sha="$SHA" \
              -f branch="develop"
          done
