name: "Mocks: Tests"

defaults:
  run:
    working-directory: mocks

permissions:
  contents: read

on:
  push:
    paths:
      - 'mocks/**'
      - 'commons/**'
  pull_request:
    paths:
      - 'mocks/**'

jobs:
  tests:
    name: Tests (RSpec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          bundler-cache: true
          working-directory: mocks

      - name: Run tests
        run: bundle exec rspec
