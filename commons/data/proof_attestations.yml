# Déclaration des attestations vérifiables, partagée par siade (émission, PDF) et
# site (page de vérification).
#
# Un seul fichier pour tous les endpoints : la clé se déduit du nom du retriever
# (CNAV::ParticipationFamilialeEAJE -> cnav.participation_familiale_eaje). Ajouter
# un endpoint n'ajoute donc aucune ligne dans les .expand.
#
# `proof_attributes` (token de vérification, 5 ans) et `proof_attestation_attributes`
# (contenu du PDF) sont POSITIONNELS : leur ordre doit rester aligné sur les
# tableaux renvoyés par les méthodes de même nom sur le retriever. Réordonner un
# champ suppose donc de déplacer ensemble l'entrée ici et sa position là-bas.
#
# Le jeu de champs d'une attestation est figé pour une version d'API donnée :
# ajouter, retirer ou renommer un champ passe par une nouvelle route versionnée.
# Réordonner l'affichage, en revanche, ne demande aucune montée de version.
shared:
  cnav:
    participation_familiale_eaje:
      title: ATTESTATION DE PARTICIPATION FAMILIALE (EAJE)
      source: CNAF
      proof_attributes:
        allocataires: Allocataires
        nombre_enfants: Enfants
        parametres_calcul_participation_familiale: Paramètres de calcul de la participation familiale
      proof_attestation_attributes:
        allocataires: Allocataires
        enfants: Enfants
        adresse: Adresse
        parametres_calcul_participation_familiale: Paramètres de calcul de la participation familiale
      labels:
        nom_naissance: Nom de naissance
        nom_usage: Nom d'usage
        prenoms: Prénoms
        date_naissance: Date de naissance
        sexe: Sexe
        code_cog_insee_commune_naissance: Code INSEE de la commune de naissance
        destinataire: Destinataire
        complement_information: Complément d'information
        complement_information_geographique: Complément d'information géographique
        numero_libelle_voie: Numéro et libellé de voie
        lieu_dit: Lieu-dit
        code_postal_ville: Code postal / Ville
        pays: Pays
        nombre_enfants: Nombre d'enfants
        nombre_enfants_a_charge: Nombre d'enfants à charge
        nombre_enfants_beneficiaire_aeeh: Nombre d'enfants bénéficiaires de l'AEEH
        base_ressources_annuelles: Base de ressources annuelles
        annee_calcul: Année de calcul
      values:
        sexe:
          M: Masculin
          F: Féminin
