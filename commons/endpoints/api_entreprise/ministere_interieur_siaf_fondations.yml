    data:
      description: |+
        Cette API délivre les données de référence d'une fondation inscrite au **Répertoire National des Fondations (RNF)** :

        - **l'identité de la fondation** : identifiant RNF, SIREN/SIRET, type juridique (FRUP, FE, FDD), nom, état, dates de création et de terme, clôture de l'exercice, adresse du siège, courriel et téléphone ;
        - **ses activités** : objet, domaines d'intérêt général, activité internationale prévue par les statuts ;
        - **sa filiation** : organismes dont la fondation est issue (transformation d'une association ou d'un fonds de dotation) ;
        - **ses dirigeants en fonction** : nom, prénom, fonction et qualité ;
        - **les années pendant lesquelles elle a déclaré avoir reçu des subventions publiques** ;
        - **ses statuts**, ainsi que le règlement intérieur et le rapport d'activité d'une FRUP et le rapport d'activité d'une fondation d'entreprise, à télécharger.

        Selon les données cochées dans la demande d'habilitation, la réponse sert en plus :

        - **les bénéficiaires effectifs** (marchés publics et lutte contre la fraude) : identité complète de toutes les personnes siégeant ou dirigeant la fondation, y compris celles sorties de leurs fonctions ;
        - **les comptes**, et le rapport d'activité d'un fonds de dotation (subventions publiques, marchés publics et lutte contre la fraude) ;
        - **les données de contrôle** (lutte contre la fraude) : années d'appel à la générosité publique et de financements étrangers, et toutes les autres pièces jointes (procès-verbaux, décisions administratives et juridictionnelles…).

        Un bloc auquel le jeton n'a pas droit est absent de la réponse.

        {:.fr-highlight}
        > La conformité comptable (état de transmission des comptes) n'est pas
        > servie : elle ne reflète à ce jour que les dépôts faits depuis la
        > démarche en ligne.
    opening: protected
    parameters:
      - Numéro de SIREN ou de SIRET de la fondation, ou son identifiant RNF
    format:
      - Donnée structurée JSON
    faq:
      - q: "Qu'est-ce que l'identifiant RNF ?"
        a: |+
          L'identifiant RNF est l'identifiant officiel d'une fondation au Répertoire
          National des Fondations, défini par décret. Il est au format
          `{département}-{type}-{numéro}-{suffixe}`, par exemple `075-FRUP-00194-01`.
      - q: "Puis-je toujours appeler l'API avec un SIREN ou un SIRET ?"
        a: |+
          Environ 28 % des fondations du référentiel n'ont pas de SIRET (elles n'ont
          pas d'obligation d'immatriculation au répertoire Sirene tant qu'elles
          n'emploient pas de salarié notamment). Ces fondations ne sont accessibles
          que par leur identifiant RNF.

          Le SIRET appelé doit être celui que le référentiel connaît pour la
          fondation. Quelques SIRET y sont par ailleurs rattachés à deux fondations :
          un appel par SIREN ou SIRET ne renvoie alors que l'une des deux.
          L'identifiant RNF est donc la clé d'appel la plus fiable.
      - q: "Quelle est la différence entre une fondation et une association ?"
        a: |+
          Une **association** est un groupement de *personnes* (des membres) ; une
          **fondation** est une *affectation de patrimoine* : de l'argent ou des biens
          dédiés irrévocablement à une cause d'intérêt général, à but non lucratif.
          Une fondation n'a pas de membres. Pour les associations, consulter
          l'[API Données association](/catalogue/djepva/associations).
      - q: "Quelle différence entre dirigeants et bénéficiaires effectifs ?"
        a: |+
          Ce sont les mêmes personnes : pour une fondation, toute personne exerçant
          des fonctions d'administration, de surveillance ou de direction est
          regardée comme bénéficiaire effectif (article R561-3 du code monétaire et
          financier). Seules les données communicables changent selon le cas
          d'usage : nom, prénom, fonction et qualité des dirigeants en fonction pour
          tous, identité complète et historique des fonctions pour les marchés
          publics et la lutte contre la fraude.
      - q: "Quelles pièces jointes sont servies, et comment les télécharger ?"
        a: |+
          Les pièces sont servies selon leur **type**, c'est-à-dire la rubrique de la
          démarche dans laquelle la fondation les a déposées, et les scopes de votre
          jeton (voir la description des données). Une pièce déposée dans la mauvaise
          rubrique est servie sous le type de cette rubrique : le contenu d'un fichier
          n'est pas contrôlé. Un type de pièce ajouté par le Ministère de l'Intérieur
          n'est servi qu'à la lutte contre la fraude, tant qu'il n'a pas été ouvert à
          d'autres cas d'usage.

          Chaque pièce porte un lien `url`, valable **1 heure** et lié au jeton qui
          l'a obtenu, dont les scopes sont vérifiés à nouveau à l'appel. Ce lien
          renvoie un `document_url`, valable 24 heures, d'où télécharger le fichier.
          La plupart des pièces sont des PDF ; `type_mime` indique les autres formats
          (documents bureautiques, images, archives).
      - q: "L'environnement de test applique-t-il les scopes ?"
        a: |+
          Non : l'environnement de test sert toujours la réponse complète, avec des
          données fictives. En production, les blocs auxquels votre jeton n'a pas
          droit sont absents de la réponse.
      - q: "Pourquoi la liste des années de subventions publiques est-elle souvent vide ?"
        a: |+
          Les années de subventions publiques sont **déclaratives** : elles ne sont
          renseignées que lorsque la fondation a effectué la démarche correspondante
          auprès du Ministère de l'Intérieur, ce qui n'est le cas que d'une petite
          partie des fondations à ce jour. Une liste vide signifie qu'aucune
          déclaration n'a été enregistrée, pas que la fondation n'a reçu aucune
          subvention.
    historique: |+
      **Retour des pièces jointes :** `documents` est de nouveau servi, filtré
      selon le type de pièce et les scopes du jeton, avec pour chaque pièce un lien
      de téléchargement (`url`). Par rapport à l'environnement de test, chaque
      pièce gagne `taille`, `date_effet` et le lien de téléchargement.

      **Ce qui change par rapport à la version proposée en environnement de test :**
      La réponse dépend désormais des scopes du jeton :
      - `dirigeants` ne garde que les dirigeants en fonction, avec leur nom,
        prénom, fonction et qualité ; leur identité complète, dirigeants sortis
        compris, est servie dans `beneficiaires_effectifs`, réservé aux marchés
        publics et à la lutte contre la fraude, avec une adresse de domiciliation
        réduite à l'adresse complète et au pays ; la personne morale représentée
        (`personne_morale`) n'est plus servie ;
      - les années d'appel à la générosité publique et de financements étrangers
        (`situation_financiere.annees_appel_generosite_publique`,
        `situation_financiere.annees_financements_etrangers`) sont réservées à la
        lutte contre la fraude.

      Ont été retirés :
      - la conformité comptable (`conformite_comptable`) : l'état de transmission
        des comptes et les exercices transmis ne reflètent à ce jour que les dépôts
        faits depuis la nouvelle démarche en ligne ;
      - les champs d'adresse `type_voie`, `complement` et `distribution`, que le
        référentiel ne sert pas : le type de voie est inclus dans `libelle_voie`.

      La filiation liste désormais les organismes dont la fondation est issue, et
      son type d'opération n'est plus une liste fermée.
