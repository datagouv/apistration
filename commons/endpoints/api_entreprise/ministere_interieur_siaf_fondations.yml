    data:
      description: |+
        Cette API délivre les données de référence d'une fondation inscrite au **Répertoire National des Fondations (RNF)** :

        - **l'identité de la fondation** : identifiant RNF, SIREN/SIRET, type juridique (FRUP, FE, FDD), nom, état, dates de création et de terme, adresse du siège, contacts ;
        - **ses activités** : objet, domaines d'intérêt général, activité internationale prévue par les statuts ;
        - **ses dirigeants et représentants** : identité, fonction, qualité, dates de fonctions, y compris les personnes morales représentées ;
        - **sa filiation** : transformation, fusion, scission ;
        - **sa situation financière déclarative** : années de subventions publiques, d'appel à la générosité publique et de financements étrangers ;
        - **sa conformité comptable** : état de transmission des comptes et exercices transmis ;
        - **les métadonnées de ses pièces justificatives** : statuts, comptes, rapports d'activité, procès verbaux.

        {:.fr-highlight}
        > Le périmètre de données sera progressivement enrichi au fur et à mesure de
        > l'alimentation du référentiel par les démarches des fondations : données
        > comptables chiffrées (bilan, produits, charges, résultat), montants et pays
        > des financements étrangers, détail des campagnes d'appel à la générosité
        > publique, liquidateur, caractère consomptible de la dotation.
    opening: protected
    parameters:
      - Numéro de SIREN ou de SIRET de la fondation, ou son identifiant RNF
    format:
      - Donnée structurée JSON
    faq:
      - q: "Qu'est-ce que l'identifiant RNF ?"
        a: |+
          L'identifiant RNF est l'identifiant officiel d'une fondation au Répertoire
          National des Fondations, défini par décret. Il est au format
          `{département}-{type}-{numéro}-{suffixe}`, par exemple `075-FRUP-00194-01`.
      - q: "Puis-je toujours appeler l'API avec un SIREN ou un SIRET ?"
        a: |+
          Environ 22 % des fondations du référentiel n'ont pas de SIRET (elles n'ont
          pas d'obligation d'immatriculation au répertoire Sirene tant qu'elles
          n'emploient pas de salarié notamment). Ces fondations ne sont accessibles
          que par leur identifiant RNF. L'identifiant RNF est la clé d'appel la plus
          fiable.
      - q: "Quelle est la différence entre une fondation et une association ?"
        a: |+
          Une **association** est un groupement de *personnes* (des membres) ; une
          **fondation** est une *affectation de patrimoine* : de l'argent ou des biens
          dédiés irrévocablement à une cause d'intérêt général, à but non lucratif.
          Une fondation n'a pas de membres. Pour les associations, consulter
          l'[API Données association](/catalogue/djepva/associations).
      - q: "Pourquoi certaines données financières sont-elles vides ?"
        a: |+
          Les données de situation financière (années de subventions publiques,
          d'appel à la générosité publique, de financements étrangers) sont
          **déclaratives** : elles ne sont renseignées que lorsque la fondation a
          effectué la démarche correspondante auprès du Ministère de l'Intérieur.
          Une liste vide signifie qu'aucune déclaration n'a été enregistrée, pas
          nécessairement que la fondation n'est pas concernée.
