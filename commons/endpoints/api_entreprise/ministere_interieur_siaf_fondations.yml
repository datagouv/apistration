    perimeter:
      entity_type_description: |+
        Cette API concerne ✅ **les fondations inscrites au Répertoire National des Fondations (RNF)**, tenu par le Ministère de l'Intérieur :

        - ✅ **les fondations reconnues d'utilité publique (FRUP)** ;
        - ✅ **les fondations d'entreprise (FE)** ;
        - ✅ **les fonds de dotation (FDD)**.

        **Ne sont pas couvertes par l'API :**
        - ❌ les associations, y compris reconnues d'utilité publique — consulter l'[API Données association](/catalogue/djepva/associations) ;
        - ❌ les fondations abritées, qui n'ont pas de personnalité morale propre.
