    data:
      description: |+
        Cette API délivre les données de référence d'une fondation inscrite au **Répertoire National des Fondations (RNF)** :

        - **l'identité de la fondation** : identifiant RNF, SIREN/SIRET, type juridique (FRUP, FE, FDD), nom, état, dates de création et de terme, clôture de l'exercice, adresse du siège, courriel et téléphone ;
        - **ses activités** : objet, domaines d'intérêt général, activité internationale prévue par les statuts ;
        - **sa filiation** : organismes dont la fondation est issue (transformation d'une association ou d'un fonds de dotation) ;
        - **les années pendant lesquelles elle a déclaré avoir reçu des subventions publiques**.

        {:.fr-highlight}
        > Les dirigeants, les pièces justificatives et les données comptables ne sont
        > pas servis par cette API : ils feront l'objet d'API dédiées, ouvertes selon
        > les cas d'usage autorisés par le Ministère de l'Intérieur.
    opening: protected
    parameters:
      - Numéro de SIREN ou de SIRET de la fondation, ou son identifiant RNF
    format:
      - Donnée structurée JSON
    faq:
      - q: "Qu'est-ce que l'identifiant RNF ?"
        a: |+
          L'identifiant RNF est l'identifiant officiel d'une fondation au Répertoire
          National des Fondations, défini par décret. Il est au format
          `{département}-{type}-{numéro}-{suffixe}`, par exemple `075-FRUP-00194-01`.
      - q: "Puis-je toujours appeler l'API avec un SIREN ou un SIRET ?"
        a: |+
          Environ 28 % des fondations du référentiel n'ont pas de SIRET (elles n'ont
          pas d'obligation d'immatriculation au répertoire Sirene tant qu'elles
          n'emploient pas de salarié notamment). Ces fondations ne sont accessibles
          que par leur identifiant RNF.

          Le SIRET appelé doit être celui que le référentiel connaît pour la
          fondation. Quelques SIRET y sont par ailleurs rattachés à deux fondations :
          un appel par SIREN ou SIRET ne renvoie alors que l'une des deux.
          L'identifiant RNF est donc la clé d'appel la plus fiable.
      - q: "Quelle est la différence entre une fondation et une association ?"
        a: |+
          Une **association** est un groupement de *personnes* (des membres) ; une
          **fondation** est une *affectation de patrimoine* : de l'argent ou des biens
          dédiés irrévocablement à une cause d'intérêt général, à but non lucratif.
          Une fondation n'a pas de membres. Pour les associations, consulter
          l'[API Données association](/catalogue/djepva/associations).
      - q: "Pourquoi la liste des années de subventions publiques est-elle souvent vide ?"
        a: |+
          Les années de subventions publiques sont **déclaratives** : elles ne sont
          renseignées que lorsque la fondation a effectué la démarche correspondante
          auprès du Ministère de l'Intérieur, ce qui n'est le cas que d'une petite
          partie des fondations à ce jour. Une liste vide signifie qu'aucune
          déclaration n'a été enregistrée, pas que la fondation n'a reçu aucune
          subvention.
    historique: |+
      **Ce qui change par rapport à la version proposée en environnement de test :**
      La version de production ne sert que les données ouvertes à tous les cas
      d'usage protégés par le Ministère de l'Intérieur. Ont été retirés :
      - les dirigeants (`dirigeants`) : ce sont à la fois les représentants légaux
        et les bénéficiaires effectifs de la fondation, et les informations
        diffusables à leur sujet dépendent du cas d'usage ;
      - les pièces justificatives (`documents`) : les pièces diffusables dépendent
        de leur type et du cas d'usage ;
      - la conformité comptable (`conformite_comptable`) : l'état de transmission
        des comptes et les exercices transmis ne reflètent à ce jour que les dépôts
        faits depuis la nouvelle démarche en ligne ;
      - les années d'appel à la générosité publique et de financements étrangers
        (`situation_financiere.annees_appel_generosite_publique`,
        `situation_financiere.annees_financements_etrangers`), réservées à la
        lutte contre la fraude ;
      - les champs d'adresse `type_voie`, `complement` et `distribution`, que le
        référentiel ne sert pas : le type de voie est inclus dans `libelle_voie`.

      La filiation liste désormais les organismes dont la fondation est issue, et
      son type d'opération n'est plus une liste fermée.
