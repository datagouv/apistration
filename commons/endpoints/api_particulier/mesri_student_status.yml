    faq:
      - q: <a name="diff-statut-admis-inscrit"></a> Quelle différence entre le statut "admis" et le statut "inscrit" ?
        a:
          "Lorsque la candidature ou la demande de l'étudiant à rejoindre un établissement d'enseignement supérieur est accordée, le statut d'inscription est \"admis\".


          À partir du moment où toute la procédure d'inscription est terminée et où **l'étudiant est en règle de ses droits d'inscription, le statut de l'étudiant passe alors à \"inscrit\"**. Selon les règles de l'établissement et le statut de l'étudiant, le passage du statut \"admis\" au statut \"inscrit\" se réalise après règlement total des droits, un premier versement ou l'acquittement.


          Un étudiant peut être inscrit dans différents établissements."

      - q: <a name="definition-regime-formation"></a> Quels sont les régimes de formation possibles ?
        a: |+
          Le régime de formation est transmis par le ministère de l'enseignement supérieur pour chaque admission. Il peut prendre 7 valeurs, qui relèvent soit de la formation initiale, soit de la formation continue ([voir la différence](#diff-formation-initiale-continue)) :

          {:.fr-table}
          | Code | Libellé | Catégorie |
          |------|---------|-----------|
          | RF1 | formation initiale | Formation initiale |
          | RF2 | formation initiale hors apprentissage | Formation initiale |
          | RF3 | reprise d'études non financée sans convention | Formation initiale |
          | RF4 | contrat d'apprentissage | Formation initiale |
          | RF5 | formation continue | Formation continue |
          | RF6 | formation continue hors contrat professionnel | Formation continue |
          | RF7 | contrat de professionnalisation | Formation continue |

          Les régimes RF4 et RF7 correspondent aux deux contrats de travail en alternance : le contrat d'apprentissage relève de la formation initiale, le contrat de professionnalisation de la formation continue.

          Le code (`RF1` à `RF7`) est un code technique ajouté par API Particulier : il permet d'exploiter la donnée indépendamment du libellé.

          **Historique :** jusqu'au printemps 2024, seules les valeurs « formation initiale » et « formation continue » étaient transmises par le ministère. Les 5 autres valeurs, plus détaillées, ont été ajoutées depuis ; les deux valeurs historiques peuvent toujours être transmises.
          En V2, pour les étudiants inscrits, ces régimes sont regroupés sous les deux valeurs historiques. La V3 restitue la valeur détaillée : la colonne « Catégorie » donne l'équivalent V2.

      - q: <a name="diff-formation-initiale-continue"></a> Quelle différence entre formation initiale et formation continue ?
        a:
          La distinction principale entre formation initiale et formation continue est le **critère de conventionnement spécifique à la formation continue** et qui se traduit par la signature d’une convention ou d’un contrat de formation professionnelle entre la personne et l’établissement formateur tel qu’il est décrit dans les [articles L.6353-1 à L. 6353-7 du Code du travail](https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006072050/LEGISCTA000006178215/#LEGISCTA000006178215) et l’[article D. 714-62 du Code de l’éducation](https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000027866356/).
    historique: |+
      **Septembre 2026** — les erreurs de jeton FranceConnect changent de code : `50001` → `51501`, `50002` → `51502`, `50003` → `51503`, `50004` → `51504`. Le statut HTTP `401`, le titre et le message sont inchangés.

      **Ce que change le passage à la V.3 d'API Particulier:**

      - Afin de faciliter la compréhension de l’API, la liste "Inscriptions" a été renommée en "Admissions". En effet, c’est bien la liste des admissions qui est délivrée pour chaque étudiant. Parmi elles, l’étudiant peut être allé jusqu’à l’inscription, qui est alors indiquée par le champ "Statut étudiant inscrit".
      - Tous les changements sont décrits dans la [table de correspondance du guide migration](/blog/migration-api-particulier-v3#correspondance-api-statut-etudiant){:target="_blank"}

