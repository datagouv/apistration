    faq:
      - q: <a name="composition-foyer-rsa"></a> Comment est composé un foyer RSA ?
        a: |+
          Le foyer RSA est défini par le Code de l'action sociale et des familles (articles L262-2 et R262-3). Il comprend :

          - **l'allocataire**, c'est-à-dire la personne qui demande le RSA et en est titulaire ;
          - **son conjoint**, son partenaire de PACS ou son concubin, le cas échéant ;
          - **les personnes à charge**, à savoir :
            - les enfants qui ouvrent droit aux prestations familiales ;
            - les autres enfants et personnes de **moins de 25 ans** à la charge effective et permanente de l'allocataire.

          Une personne de 25 ans ou plus n'est donc pas considérée comme à charge au sens du RSA, même si elle vit sous le même toit. Elle n'apparaîtra pas dans les personnes à charge restituées par l'API.

          Le foyer RSA ne correspond donc pas forcément au foyer fiscal ni au foyer pour les prestations familiales. Un même enfant peut être à charge au sens du RSA sans figurer sur la déclaration de revenus de ses parents, et inversement.
