fr:
  mailers:
    authorization_request_mailer:
      demande_recue:
        subject: 📬 Votre demande d'accès à l'%{api_name} a bien été reçue par nos services.
        update_subject: 📬 Votre demande de mise à jour de votre accès à l'%{api_name} a bien été reçue par nos services.
      embarquement_modifications_demandees:
        subject: ✒️ Votre demande requiert des modifications.
        update_subject: ✒️ Votre demande de mise à jour requiert des modifications.
      embarquement_demande_refusee:
        subject: 🚫 Votre demande d'accès est refusée.
        update_subject: 🚫 Votre demande de mise à jour est refusée.
      demande_validee:
        subject: "✅ Demande validée : créez votre jeton %{api_name}"
        delegated_subject: ✅ Demande validée
        update_subject: ✅ Mise à jour de la demande validée

    token_mailer:
      expiration_notice:
        subject_30: 🔑 Le jeton « %{name} » de la demande n°%{external_id} expire dans 30 jours
        subject_7: 🔑⚠️ Le jeton « %{name} » de la demande n°%{external_id} expire dans 7 jours
        subject_0: 🔒 Le jeton « %{name} » de la demande n°%{external_id} a expiré
      magic_link:
        subject: 🔑 Lien d'accès temporaire au jeton %{api_name}
        signature: L'équipe %{api_name}
        link_description: Un lien vers un jeton d'accès %{api_name} vient d'être généré à votre intention. Vous pouvez accéder à ce jeton via le lien
      banned:
        subject: 🔑⚠️ Votre token d'accès %{api_name} a été banni
      created:
        subject: 🔑 Jeton "%{name}" créé sur votre demande n°%{external_id}
      revoked:
        subject: 🔑 Jeton "%{name}" révoqué sur votre demande n°%{external_id}

    changelog_mailer:
      weekly:
        subject: 📰 Les nouveautés %{api_name} de la semaine

    audit_mailer:
      notify:
        subject: "🔍 Anomalie détectée sur votre habilitation DataPass n°%{id}"

  api_particulier:
    reporters_mailer:
      submit:
        subject: Une nouvelle demande a été déposée pour API Particulier
      approve:
        subject: Une nouvelle demande a été validée pour API Particulier
