---
fr:
  api_entreprise:
    cas_usages_entries:

      socle_de_base:
        name: 'Socle de base DLNUF'
        user_types:
          - Tous les acteurs publics
        introduction:
          title: Intégrez dès maintenant le socle de base des données entreprises et associations !
          content: |
            {:.fr-text--lead}
            Administrations ou assimilé, API Entreprise vous permet d'accéder aux données de base des entreprises et associations utiles pour simplifier leurs démarches dans le cadre du principe du « Dites-le nous une fois ». À partir de leur identifiant RNA ou du numéro de SIRET, vous pouvez récupérer ces informations et simplifier leur expérience sur vos services.
        role:
          title: Une simplification des démarches
          anchor: 'simplification-des-demarches'
          content: |+
            {:.fr-text--lg}
            Administrations et collectivités, en intégrant la brique API Entreprise dans votre site ou portail usager :

            - 🗄 **Vous accédez facilement aux données de base** utiles pour mettre en oeuvre le «&nbsp;Dites-le-nous une fois&nbsp;» pour la plupart des démarches : 
              - Données publiques : données des répertoires Sirene, RNE et RNA ; actes et bilans de l'Inpi ; numéros TVA et EORI ; certifications Bio, RGE, OPQIBI, Qualifelec, Qualibat et carte professionnelle de travaux public de la FNTP. 
              - Données protégées 🔐 : données des unités en diffusion partielle des répertoire RNE et RNA ; montant des subventions et documents administratifs complémentaires (DAC) des associations.

            - ⏰ **Vous accélérez le traitement des démarches** car vos agents instructeurs n'ont pas de vérifications supplémentaires à réaliser, **les informations obtenues de l'API Entreprise étant certifiées 🔎** ;

            - 🎢 **Vous augmentez le pourcentage des démarches finalisées** car vous faites gagner du temps à l'usager ;

            - 🎯 **Enfin, vous participez activement à la simplification des démarches pour les citoyens**, en mettant en place le [«&nbsp;Dites-le-nous une fois&nbsp;»](https://www.numerique.gouv.fr/services/guichet-dites-le-nous-une-fois/){:target="_blank"} : vous ne demandez plus à une entreprise/association une information qu'elle a déjà donnée ou que l'administration connaît déjà. <br>Vous vous mettez ainsi **en conformité avec la législation** et l'[Article L113-12 du Code des relations entre le public et l'administration](https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037313155){:target="_blank"}.
        list_api:
          content: |+
            {:.fr-text--xl}
            Ce tableau dresse la liste des API accessibles pour ce cadre juridique via ce [formulaire d'habilitation](#request-access). Toute administration ou assimilé est autorisée à y accéder pour mettre en œuvre le principe du « Dites-le nous une fois ».

            {:.fr-highlight.fr-highlight--caution}
            ⚠️ **Les données protégées 🔐 doivent uniquement être utilisées par un agent habilité ou après authentification de l'usager.** Elles ne doivent pas être diffusées en ligne ou à des tiers non-autorisés.

            {:.fr-highlight}
            > 💡 **Votre service concerne les marchés publics ? la délivrance d'aides ou de subventions ?**
            > Des cas d'usages spécifiques existent et permettent d'accéder au socle de données de base ainsi qu'à d'autres données protégées : marchés publics, aides et subventions publiques ou subventions des associations.

            {:.fr-table}
            | API | Ouverture | Identifiant d'appel | Commentaires |
            | --- | --------- | ------------------- | ------------ |
            | [Données d'établissement](<%= endpoint_path(uid: 'insee/etablissements_diffusibles') %>) - INSEE | Open data | SIRET | Préremplir ou récupérer les informations d'un établissement et de son unité légale à partir de son SIRET&nbsp;: raison sociale, forme juridique, catégorie TPE/PME, tranche effectif, activité principale, date de création. |
            | [Attestation d'immatriculation RNE](<%= endpoint_path(uid: 'inpi/rne/attestation_immatriculation') %>) - INPI | Protégée 🔐 | SIREN | Données figurant sur l'attestation d'immatriculation au RNE et lien vers le document PDF. Backoffice instructeur uniquement. |
            | [Données d'établissement (diffusion partielle)](<%= endpoint_path(uid: 'insee/etablissements') %>) - INSEE | Protégée 🔐 | SIRET | Mêmes données que l'API open data, avec en plus les établissements en diffusion partielle. Backoffice instructeur uniquement. |
            | [Extrait RCS](<%= endpoint_path(uid: 'infogreffe/rcs/extrait') %>) - Infogreffe | Open data | SIREN | Préremplir les informations d'un K-bis&nbsp;: nom commercial, dénomination. Depuis le 23/11/2021, le K-bis ne peut plus être demandé à l'entreprise ([décret](https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000043523039){:target='_blank'}). |
            | [Actes et bilans RNE](<%= endpoint_path(uid: 'inpi/rne/actes_bilans') %>) - INPI | Open data | SIREN | Consulter les actes (historique des modifications, associés) et les bilans (capitaux propres, chiffre d'affaires, encours). |
            | [Données d'unité légale](<%= endpoint_path(uid: 'insee/unites_legales_diffusibles') %>) - INSEE | Open data | SIREN | Ces données sont également distribuées par l'API Données d'établissement. |
            | [Données d'unité légale (diffusion partielle)](<%= endpoint_path(uid: 'insee/unites_legales') %>) - INSEE | Protégée 🔐 | SIREN | Mêmes données que l'API open data, avec en plus les unités légales en diffusion partielle. Backoffice instructeur uniquement. |
            | [Données du siège social](<%= endpoint_path(uid: 'insee/siege_social_diffusibles') %>) - INSEE | Open data | SIREN | À partir du Siren, récupérer les informations du siège social. |
            | [Données du siège social (diffusion partielle)](<%= endpoint_path(uid: 'insee/siege_social') %>) - INSEE | Protégée 🔐 | SIREN | Mêmes données que l'API open data, avec en plus les sièges en diffusion partielle. Backoffice instructeur uniquement. |
            | [Adresse d'établissement](<%= endpoint_path(uid: 'insee/adresse_etablissements_diffusibles') %>) - INSEE | Open data | SIRET | Ces données sont également distribuées par l'API Données d'établissement. |
            | [Adresse d'établissement (diffusion partielle)](<%= endpoint_path(uid: 'insee/adresse_etablissements') %>) - INSEE | Protégée 🔐 | SIRET | Mêmes données que l'API open data, avec en plus les adresses en diffusion partielle. Backoffice instructeur uniquement. |
            | [Liens de succession d'établissement](<%= endpoint_path(uid: 'insee/successions') %>) - INSEE | Open data | SIRET | Retrouver les établissements prédécesseurs et successeurs d'un établissement, la date d'effet de la succession, et précise s'il s'agit d'un changement de siège ou s'il y a continuité économique. |
            | [Données d'association complètes](<%= endpoint_path(uid: 'djepva/associations') %>) - DJEPVA | Protégée 🔐 | SIREN ou RNA | Informations complètes d'une association&nbsp;: identité, activités, agréments, représentants légaux, effectifs, données financières. Backoffice instructeur uniquement. |
            | [Données association (open data)](<%= endpoint_path(uid: 'djepva/associations_open_data') %>) - DJEPVA | Open data | SIREN ou RNA | Informations d'une association en open data utilisables pour pré-remplir une démarche sans authentification préalable. |
            | [Subventions d'association](<%= endpoint_path(uid: 'data_subvention/subventions') %>) - DataSubvention | Protégée 🔐 | SIRET, SIREN ou RNA | Subventions accordées à une association. Backoffice instructeur uniquement. |
            | [Numéro EORI](<%= endpoint_path(uid: 'douanes/immatriculation_eori') %>) - Douanes | Open data | SIRET | Préremplir et vérifier le numéro EORI à partir du SIRET, pour les entreprises ayant réalisé leur immatriculation en France. |
            | [Carte professionnelle travaux publics](<%= endpoint_path(uid: 'fntp/carte_professionnelle_travaux_public') %>) - FNTP | Open data | SIREN | Récupérer la carte professionnelle attestant que l'entreprise est à jour de ses cotisations congés payés. |
            | [Certifications Bio](<%= endpoint_path(uid: 'agence_bio/certifications_bio') %>) - Agence Bio | Open data | SIREN | Préremplir les certifications en agriculture biologique d'une entreprise. |
            | [Certifications RGE](<%= endpoint_path(uid: 'ademe/certifications_rge') %>) - ADEME | Open data | SIRET | Préremplir les qualifications Reconnu Garant de l'Environnement et accéder au certificat PDF. |
            | [Certifications bâtiment](<%= endpoint_path(uid: 'qualibat/certifications_batiment') %>) - Qualibat | Open data | SIRET | Accéder au certificat Qualibat en PDF. |
            | [Qualifications ingénierie](<%= endpoint_path(uid: 'opqibi/qualifications_ingenierie') %>) - OPQIBI | Open data | SIREN | Préremplir les qualifications OPQIBI et accéder au certificat PDF. |
            | [Certificats électricité](<%= endpoint_path(uid: 'qualifelec/certificats') %>) - Qualifelec | Open data | SIRET | Préremplir les qualifications Qualifelec et accéder au certificat PDF. |
            | [Numéro de TVA](<%= endpoint_path(uid: 'commission_europeenne/numero_tva') %>) - Commission européenne | Open data | SIREN | Préremplir et vérifier le numéro de TVA certifié. Fonctionne pour les entreprises ayant un Siren et un numéro TVA au format français. |

        use_case_examples:
          title: Exemples d'applications
          anchor: 'use_case_examples'
          content: |+
            {:.fr-h4}
            ### Une entreprise ou une association effectue une démarche en ligne auprès de votre service connecté à API Entreprise&nbsp;:

            1. **Elle renseigne son identifiant** (Siret ou RNA) :

               {:.fr-highlight.fr-highlight--example}
               ⚙️ **En arrière-plan** : Un appel à l'API Entreprise est effectué.

               ![Image de présentation de l'article sur le numéro de TVA intracommunautaire](<%= image_path('api_entreprise/cas_usages/pictos/use_case_examples/portail-gru-use_case_example_1a.png') %>){:width="600px"}


            2. **Les informations administratives en open data la concernant sont pré-remplies automatiquement**. Elle les corrige si besoin et poursuit sa démarche :

               {:.fr-highlight.fr-highlight--example}
               ⚙️ **En arrière-plan** : À partir du format structuré (.json) transmis par l'API Entreprise, vous choisissez la façon d'afficher l'information sur votre site.
               ⚠️ Si votre démarche ne permet pas d'authentifier l'usager, seule de la donnée ouverte peut être pré-remplie. Les données protégées ne doivent jamais être accessibles sans authentification au préalable.

               ![Image de présentation de l'article sur le numéro de TVA intracommunautaire](<%= image_path('api_entreprise/cas_usages/pictos/use_case_examples/portail-gru-use_case_example_1b.png') %>){:width="600px"}

            {:.fr-h4}
            ### Un exemple avec Laurent, mandataire d'une association :

            <span class='fr-badge fr-badge--sm fr-badge--new'>Données publiques uniquement</span>

            {:.fr-text--regular.fr-text--alt.fr-text--lg}
            _Laurent a besoin d'inscrire son association dans le ficher associatif municipal_ pour réserver une salle à la maison des associations. Laurent se rend sur le portail informatique de sa commune, il sélectionne la démarche "J'inscris ma structure dans le fichier associatif municipal". En début de formulaire, il renseigne son numéro RNA. Le formulaire est automatiquement pré-rempli des informations de l'association : _la forme juridique, la date de création, les activités, le statut d'utilité publique, l'adresse ou encore la tranche de l'effectif_... Tout a déjà été rempli. Laurent vérifie qu'il n'y a pas d'erreur, et envoie sa demande.

            {:.fr-text--regular.fr-text--alt.fr-text--lg}
            La demande est traitée de façon automatique car toutes les données nécessaires proviennent de l'API Entreprise et sont certifiées. Quelques secondes après l'envoi de sa demande, Laurent reçoit un e-mail lui confirmant que son association est inscrite au registre, et qu'il a désormais accès à l'outil de réservation de salle.

            {:.fr-h4}
            ### Un exemple avec Camille, agricultrice et Nicolas, agent territorial :

            <span class='fr-badge fr-badge--sm fr-badge--new'>Données publiques & protégées 🔐 </span>

            {:.fr-text--regular.fr-text--alt.fr-text--lg}
            _Camille a besoin d'un emplacement sur le marché de sa ville pour vendre sa production_. Elle s'est rendue sur le portail informatique de la commune, a sélectionné la démarche, entré son numéro de Siret. Toutes les informations publiques de son entreprise ont été automatiquement pré-remplies, elle peut les modifier si elle repère une erreur.

            {:.fr-text--regular.fr-text--alt.fr-text--lg}
            À l'étape suivante, Camille n'aura à fournir qu'un seul justificatif sur les cinq requis. En effet, le portail de sa commune lui fait savoir que les quatre autres documents ont déjà été récupérés auprès des administrations compétentes. Camille n'aura pas besoin de chercher ces documents dans ses dossiers ou de se rendre sur différents sites pour les retrouver. En ce qui concerne le document manquant, Camille n'est pas bloquée dans sa démarche, elle peut l'ajouter dans le formulaire. Elle envoie sa demande.

            {:.fr-text--regular.fr-text--alt.fr-text--lg}
            _Nicolas est agent dans la commune de Camille et chargé d'instruire les demandes des entreprises et associations_. Depuis son espace instructeur, il est habilité à traiter les démarches à et manipuler des informations protégées.
            Nicolas vient de recevoir la démarche de Camille. Depuis la fiche entreprise de l'usagère, il voit d'un coup d’œil que l'ensemble des données et documents nécessaires pour la démarche sont présents. Il n'a pas besoin de vérifier l'existence du numéro de Siret de Camille, ni de vérifier l'absence de faute de frappe dans l'adresse postale. En plus, sur les cinq documents transmis, quatre proviennent de l'API Entreprise, ils sont certifiés.
            Nicolas vérifie donc l'unique document transmis par Camille. Tout est en ordre, il valide la demande d'emplacement de marché.
        users:
          title: Ils utilisent l’API Entreprise
          anchor: 'users'
          content: |+
            {:.fr-h5}
            ### Des communes et intercommunalités

            Le [portail en ligne de la ville de Chambéry](https://simplici.chambery.fr/){:target="_blank"} : une plateforme de démarches à destination des entreprises et des associations.

            La communauté de communes de Vaison Ventoux dématérialise la demande d'une [carte permettant aux professionnels d’accéder aux déchetteries de son territoire](http://www.vaison-ventoux.fr/cadre-de-vie-solidarite/dechets/l-acces-a-la-carte-de-dechetterie-pour-les-professionnels.htm). Le formulaire accessible sous connexion sécurisée FranceConnect, est directement pré-rempli des informations disponibles par API Entreprise.


            {:.fr-h5}
            ### Des régions

            Le [portail GRU de la Région Réunion](https://demarches.cr-reunion.fr/){:target="_blank"} : une plateforme en ligne qui propose également la délivrance d'aides et subventions publiques.

            {:.fr-highlight.fr-highlight--example.fr-text--regular.fr-text--alt.fr-text--lg}
            "_L'accès à l'API entreprise nous permet de faire des contrôles lors de la création de la demande par l'usager (contrôle existence SIREN/SIRET, récupération adresse, ...) et nous permet d'afficher à nos agents des aides à l'instruction (différences entres données fournies par l'usager et les données remontées par l'API: code NAF, dénomination, taille de l'entreprise, ...)._"

            {:.fr-h5}
            ### Parfois au travers d’un éditeur de logiciel :

            {:.fr-table}
            | Éditeurs ayant intégré l'API Entreprise                                             |                                          Solution                                                                            |                     Cas d'usage                       |
            | ----------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------: | :----------------------------------------------------:|
            | **Démarches Simplifiées** <br> Service opéré par l'État (DINUM)                                               | [demarches-simplifiees.fr](www.demarches-simplifiees.fr/){:target="_blank"}                 |        Application en ligne de création de formulaire, prête à l'emploi, et mise à disposition de l'ensemble des organismes publics.      |
            | **Efalia** <br> Entreprise privée                                                   | [efalia.com](https://www.efalia.com/) <br> [Solution 6Tzen](https://www.6tzen.fr/){:target="_blank"}                 |                   Portail gestion relation usager       |
            | **Entr’ouvert** <br> Coopérative                                                    | [entrouvert.com](https://www.entrouvert.com) <br> [Publik](https://publik.entrouvert.com/){:target="_blank"}                 |                   Portail de démarches en ligne       |
            | **Lanteas** <br> Entreprise privée                                                    |    [OpenGRU](https://lanteas.com/gestion-relation-usager-open-gru-crm/){:target="_blank"}                     |                  Portail gestion relation usager      |

            _Vous êtes un éditeur proposant une solution de portail de gestion relation usager et ne figurez pas sur cette liste ?_ Veuillez nous contacter à cette adresse e-mail : [support@entreprise.api.gouv.fr](mailto:support@entreprise.api.gouv.fr).
        legal_context:
          content: |+
            {:.fr-text--lg}
            ### L'accès au socle de base, possible pour toute administration ou assimilé 

            L'accès aux données de base des entreprises et associations de l'API Entreprise, utilisables par toute administration ou assimilé, pour satisfaire le principe du « Dites-le nous une fois », est encadré par [article L114-8 du Code des relations entre le public et l'administration](https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000045213315){:target="_blank"}.

            Pour accéder au socle de base, veuillez compléter [ce formulaire](#request-access).

            {:.fr-text--lg}
            ### Engagements en termes d'exploitation des données 

            Les données accessibles via le socle de base de l'API Entreprise ont des conditions d'exploitation différentes, certaines sont publiques, d'autres protégées.

            {:.fr-highlight.fr-highlight--caution}
            > ⚠️ Les données protégées doivent uniquement être utilisées par un agent habilité ou après authentification de l'usager. Elles ne doivent pas être diffusées en ligne ou à des tiers non-autorisés.
        request_access:
          link_datapass: "<%= datapass_base_url %>/demandes/api-entreprise/nouveau?use_case=socle_de_base"
          content: "**💡 Votre service concerne les marchés publics ? la délivrance d'aides ou de subventions ?**
            Des cas d'usages spécifiques existent et permettent d'accéder au socle de données de base ainsi qu'à d'autres données protégées : consultez [nos cas d'usages sur simplifions.data.gouv.fr](https://simplifions.data.gouv.fr/solutions/bouquet-api-entreprise){:target=\"_blank\"}."

      editeur:
        name: 'Accès spécifique éditeurs de logiciels'
        user_types:
          - Éditeurs de logiciels
        introduction:
          title: Éditeurs, intégrez l'API Entreprise dans vos logiciels à destination du secteur public
          content: |+
             {:.fr-text--lead}
             Connectez vos logiciels destinés aux administrations et aux collectivtés à l'API Entreprise ! En rendant accessibles des données administratives, notre API simplifie les démarches des entreprises et des associations et facilite le quotidien des agents publics.
        role:
          title: Le rôle d’API Entreprise et votre place en tant qu'éditeur
          anchor: 'role-api-entreprise'
          content: |+
            {:.fr-h4}
            ### Un accès sous conditions

            Sous certaines conditions, les prestataires privés d'un acteur public peuvent se voir délivrer un accès à l'API Entreprise.

            {:.fr-highlight.fr-highlight--caution}
            Attention, la connexion d’un éditeur à l’API Entreprise est possible mais **le prestataire ne peut en aucun cas être destinataire des données** issues de l’API Entreprise. <br>Si le logiciel de l'éditeur s'adresse aussi à des utilisateurs non-éligibles, tels que des acteurs privés, **l'éditeur doit s'assurer que les données de l'API Entreprise ne seront accessibles qu'aux seuls utilisateurs habilités.**

            Vos engagements, une fois habilité, sont explicités dans nos [conditions générales d'utilisation](<%= cgu_path %>).

            {:.fr-h4}
            ### Une simplification des démarches pour vos utilisateurs et leurs usagers

            {:.fr-text--lg}
            Éditeurs, en intégrant la brique API Entreprise dans votre logiciel, les administrations et les collectivités :

            - 🗄 **accèdent facilement aux données publiques et protégées 🔐** de l'Insee, d'Infogreffe, de la DGFIP, de l'Urssaf... ;
            - 🎢 **augmentent le pourcentage des démarches finalisées**, en accélérant les procédures pour les entreprises et les associations grâce au préremplissage des champs avec de la donnée ouverte ;
            - ⏰ **instruisent plus rapidement les dossiers** car elles n'ont pas de vérifications supplémentaires à réaliser, **les informations obtenues de l'API Entreprise étant certifiées 🔎** ;
            - 🔄 **suivent plus facilement les prestataires** car vous pouvez automatiser la mise à jour des documents, _telle que l'attestation de vigilance_ ;
            - 🎯 **participent activement à la simplification des démarches pour les citoyens**, en mettant en place le [«&nbsp;Dites-le-nous une fois&nbsp;»](https://www.numerique.gouv.fr/services/guichet-dites-le-nous-une-fois/){:target="_blank"} : vous ne demandez plus à une entreprise/association une information qu'elle a déjà donnée ou que l'administration connaît déjà. <br>Elles se mettent ainsi **en conformité avec la législation** et, plus particulièrement l'[Article L113-12 du Code des relations entre le public et l'administration](https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037313155){:target="_blank"}.

        use_case_examples:
          title: null
          anchor: null
          content: null
