development:
  token_expiration_notice:
    cron: '0 1 * * *'
    class: 'TokenExpirationNoticeJob'
  weekly_changelog_digest:
    cron: '0 2 * * 1'
    class: 'WeeklyChangelogDigestJob'

deployed: &deployed
  token_expiration_notice:
    cron: '0 */4 * * *'
    class: 'TokenExpirationNoticeJob'
  healthcheck:
    cron: '*/5 * * * *'
    class: 'HealthcheckJob'
  public_stats_warmup:
    cron: '1 0,1 * * * Europe/Paris'
    class: 'PublicStatsWarmupJob'
  simplifions_refresh_cas_usages:
    cron: '0 * * * *'
    class: 'Simplifions::RefreshCasUsagesJob'
  weekly_changelog_digest:
    cron: '0 2 * * 1'
    class: 'WeeklyChangelogDigestJob'

production:
  <<: *deployed
  insee_password_rotation:
    cron: '5 0 * * * Europe/Paris'
    class: 'INSEEPasswordRotationJob'
  hyperping_monitors_sync:
    cron: '0 * * * *'
    class: 'HyperpingMonitorsSyncJob'

staging: *deployed
sandbox: *deployed
